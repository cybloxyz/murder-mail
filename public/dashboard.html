<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Arsip Kasus // Murder Mail</title>
<style>
:root{--bg:#f4eee1;--card:#eaddcf;--ink:#2c241d;--mute:#6b5b52;--red:#990000;--line:#d0c2b0;--sun:#d4a373}
*{box-sizing:border-box;margin:0;padding:0;font-family:'Minecraft',Courier,monospace}
body{background:var(--bg);color:var(--ink);padding-bottom:60px}
.bunting{height:10px;background:repeating-linear-gradient(90deg,var(--red) 0 24px,var(--sun) 24px 48px,var(--ink) 48px 72px)}
.wrap{max-width:760px;margin:0 auto;padding:18px 16px}
.top{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-size:.8rem;color:var(--mute);margin-bottom:14px}
.top b{color:var(--red)}
h1{color:var(--red);font-size:clamp(1.3rem,4vw,2rem);line-height:1.2}
.tag{color:var(--mute);margin:6px 0 16px;font-size:.85rem}
nav{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
nav button,.btn{background:transparent;border:2px solid var(--red);color:var(--red);padding:8px 14px;font-weight:bold;font-size:.8rem;cursor:pointer}
nav button.on,.btn:hover{background:var(--red);color:var(--bg)}
nav button:focus-visible,.btn:focus-visible,.q:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.card{background:var(--card);border:1px dashed var(--line);padding:14px;margin-bottom:12px;font-size:.85rem;line-height:1.6}
.card h3{color:var(--red);font-size:.95rem;margin-bottom:6px}
.k{font-size:.7rem;background:var(--red);color:var(--bg);padding:1px 6px;margin-right:6px}
.out{opacity:.45}.out h3{text-decoration:line-through}
.ans{margin-top:6px;padding:6px 10px;border-left:3px solid var(--red);background:var(--bg)}
.q{display:block;margin-top:6px;background:none;border:0;color:var(--red);cursor:pointer;text-align:left;text-decoration:underline;font-size:.8rem}
p{margin-bottom:10px;line-height:1.6;font-size:.9rem}ul{margin:0 0 6px 18px}
select,textarea{width:100%;background:var(--bg);border:1px solid var(--line);padding:10px;margin:4px 0 12px;color:var(--ink)}
textarea{min-height:110px}
label{font-size:.75rem;color:var(--red);font-weight:bold}
.msg{padding:12px;border:2px solid var(--red);margin-top:12px;font-size:.85rem;line-height:1.6;background:var(--card)}
.panel{display:none}.panel.on{display:block}
</style>
</head>
<body>
<div class="bunting"></div>
<div class="wrap" id="app"><p id="boot">Memverifikasi token akses...</p></div>
<script>
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const token = new URLSearchParams(location.search).get('token');
const MAX = 3;
let C, S = { out: {}, notes: '', tries: 0, solved: null };
const save = () => { try { localStorage.setItem('mm:' + C.file, JSON.stringify(S)); } catch {} };

async function init() {
  if (!token) { $('#boot').textContent = '[GAGAL] Akses ditolak. Token tidak ditemukan.'; return; }
  try {
    const r = await fetch('/api/case?token=' + encodeURIComponent(token));
    const d = await r.json();
    if (!d.ok) throw new Error(d.message);
    C = d;
    try { S = { ...S, ...JSON.parse(localStorage.getItem('mm:' + C.file) || '{}') }; } catch {}
    render();
  } catch (e) { $('#boot').textContent = '[GAGAL] ' + (e.message || 'Arsip tidak bisa dimuat.'); }
}

function render() {
  const c = C.case;
  const opts = (arr) => arr.map(([v, t]) => `<option value="${esc(v)}">${esc(t)}</option>`).join('');
  $('#app').innerHTML = `
  <div class="top"><span>Detektif <b>${esc(C.name)}</b></span><span>Berkas <b>${esc(C.file)}</b></span></div>
  <h1>${esc(c.title)}</h1><div class="tag">${esc(c.tagline)}</div>
  <nav>${['berkas', 'tersangka', 'bukti', 'tuduh'].map((t, i) => `<button data-t="${t}" class="${i ? '' : 'on'}">${t}</button>`).join('')}</nav>

  <section class="panel on" id="p-berkas">
    ${c.intro.map((p) => `<p>${esc(p)}</p>`).join('')}
    <div class="card"><h3>Lini masa</h3><ul>${c.timeline.map(([t, x]) => `<li><b>${esc(t)}</b> ${esc(x)}</li>`).join('')}</ul></div>
  </section>

  <section class="panel" id="p-tersangka">
    ${c.suspects.map((s) => `
    <div class="card ${S.out[s.id] ? 'out' : ''}">
      <h3>${esc(s.name)} <small>(${esc(s.role)})</small></h3>
      <p>${esc(s.statement)}</p>
      ${s.asks.map(([q, a], i) => `<button class="q" data-q="${s.id}-${i}">&gt; ${esc(q)}</button><div class="ans" id="a-${s.id}-${i}" hidden>${esc(a)}</div>`).join('')}
      <button class="q" data-out="${s.id}">coret / pulihkan</button>
    </div>`).join('')}
  </section>

  <section class="panel" id="p-bukti">
    ${c.evidence.map(([k, t, b]) => `<div class="card"><h3><span class="k">${esc(k)}</span>${esc(t)}</h3>${esc(b)}</div>`).join('')}
    <label for="notes">Catatan detektif (tersimpan di perangkat ini)</label>
    <textarea id="notes">${esc(S.notes)}</textarea>
  </section>

  <section class="panel" id="p-tuduh">
    <div class="card">
      <label for="culprit">Siapa pelakunya?</label>
      <select id="culprit"><option value="">pilih tersangka</option>${opts(c.suspects.map((s) => [s.id, `${s.name} (${s.role})`]))}</select>
      <label for="motive">Apa motifnya?</label>
      <select id="motive"><option value="">pilih motif</option>${opts(c.motives)}</select>
      <button class="btn" id="go">Tuduh sekarang</button> <small id="left"></small>
    </div>
    <div id="res" class="msg" ${S.solved ? '' : 'hidden'}>${S.solved ? `<b>KASUS DITUTUP</b><br>${esc(S.solved)}` : ''}</div>
  </section>`;
  tries();
}

function tries() {
  const left = MAX - S.tries;
  $('#left').textContent = S.solved ? '' : `Sisa ${Math.max(left, 0)} tuduhan`;
  $('#go').disabled = !!S.solved || left <= 0;
}

async function accuse() {
  const culprit = $('#culprit').value, motive = $('#motive').value, box = $('#res');
  box.hidden = false;
  if (!culprit || !motive) { box.textContent = 'Pilih tersangka dan motif dulu.'; return; }
  S.tries++; save(); tries();
  try {
    const r = await fetch('/api/case', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ token, culprit, motive }) });
    const d = await r.json();
    box.innerHTML = `<b>${esc(d.title || 'GAGAL')}</b><br>${esc(d.text || d.message || '')}`;
    if (d.solved) { S.solved = d.text; save(); tries(); }
  } catch { box.textContent = '[GAGAL] Server tidak merespons. Tuduhan ini tidak dihitung dulu.'; S.tries--; save(); tries(); }
}

$('#app').addEventListener('click', (e) => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.t) {
    document.querySelectorAll('nav button').forEach((x) => x.classList.toggle('on', x === b));
    document.querySelectorAll('.panel').forEach((p) => p.classList.toggle('on', p.id === 'p-' + b.dataset.t));
  } else if (b.dataset.q) { const a = $('#a-' + b.dataset.q); a.hidden = !a.hidden; }
  else if (b.dataset.out) { S.out[b.dataset.out] = !S.out[b.dataset.out]; b.closest('.card').classList.toggle('out'); save(); }
  else if (b.id === 'go') accuse();
});
$('#app').addEventListener('input', (e) => { if (e.target.id === 'notes') { S.notes = e.target.value; save(); } });
init();
</script>
</body>
</html>
